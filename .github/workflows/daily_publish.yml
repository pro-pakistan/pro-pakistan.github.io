name: 🚀 Pro Pakistan Autonomous Daily Publisher

on:
  schedule:
    # Autonomous daily execution (12:00 PM PKT / 07:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      niche:
        description: 'Pro Pakistan vertical to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - technology_telecom
          - business_finance
          - automotive_carbase
          - sports_prosports
          - education_scholarships
          - entertainment_lens
          - public_utility_guides
      format:
        description: 'Format to generate (auto, card, carousel, reel)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - carousel
          - card
          - reel
      topic:
        description: 'Custom topic / angle (optional)'
        required: false
        default: ''
        type: string
      lang:
        description: 'Language'
        required: true
        default: 'english'
        type: choice
        options:
          - english
          - urdu

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Graphics & Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick libraqm0 libfribidi0 libharfbuzz0b fonts-noto-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Autonomous Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID || '1300365879835045' }}
          IG_BUSINESS_ACCOUNT_ID: ${{ vars.IG_BUSINESS_ACCOUNT_ID || '17841424057438345' }}
          SKIP_CLEANUP: "true"
        run: |
          CMD="python run_agent.py --niche ${{ github.event.inputs.niche || 'all' }} --format ${{ github.event.inputs.format || 'auto' }} --lang ${{ github.event.inputs.lang || 'english' }} --once"
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            CMD="$CMD --topic '${{ github.event.inputs.topic }}'"
          fi
          echo "[*] Executing: $CMD"
          eval $CMD

      - name: Commit State & Blog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: autonomous editorial publish [skip ci]"
          file_pattern: 'posts.json captions_log.jsonl sitemap.xml index.html assets/posts/*'

      - name: Cleanup Temporary Storage
        if: always()
        run: |
          rm -rf storage/carousels/* storage/cards/* storage/videos/* latest_caption.txt
