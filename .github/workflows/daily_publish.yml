name: 🚀 Pro Pakistan Tech Daily Publisher

on:
  schedule:
    # Autonomous daily execution
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Tech news angle (e.g. 5G rollout in Pakistan, IT exports boom, EV incentives)'
        required: false
        default: ''
        type: string
      format:
        description: 'Format to generate'
        required: true
        default: 'card'
        type: choice
        options:
          - card
          - reel
          - both

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Graphics & Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick libraqm0 libfribidi0 libharfbuzz0b fonts-noto-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Autonomous Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID || '1300365879835045' }}
          IG_BUSINESS_ACCOUNT_ID: ${{ vars.IG_BUSINESS_ACCOUNT_ID || '17841424057438345' }}
          SKIP_CLEANUP: "true"
        run: |
          rm -f storage/videos/*.png storage/videos/*.mp4
          
          CMD="python run_agent.py --format ${{ github.event.inputs.format || 'card' }} --once"
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            CMD="$CMD --topic '${{ github.event.inputs.topic }}'"
          fi
          echo "[*] Executing: $CMD"
          eval $CMD

      - name: Commit State & Log
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update tech_news post log [skip ci]"
          file_pattern: 'captions_log.jsonl'

      - name: Cleanup Temporary Storage
        if: always()
        run: |
          rm -rf storage/videos/* latest_caption.txt
